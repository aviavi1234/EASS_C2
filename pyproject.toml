[project]
name = "eass-hit-c2"
version = "0.3.0"
description = "Command & Control POI platform (EX3)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi~=0.136.0",
    "pydantic~=2.13.3",
    "pydantic-settings~=2.9.1",
    "sqlmodel~=0.0.38",
    "uvicorn[standard]~=0.45.0",
    "httpx~=0.28.1",
    "python-multipart~=0.0.20",
    "streamlit~=1.46.0",
    "redis~=6.2.0",
    "python-jose[cryptography]~=3.4.0",
    "passlib[bcrypt]~=1.7.4",
    "bcrypt<4.1",
    "nicegui~=2.19.0",
]

[project.scripts]
c2-demo = "app.demo:main"
c2-gui = "frontend.c2_gui.main:main"

[project.optional-dependencies]
dev = [
    "pytest~=9.0.3",
    "anyio~=4.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "backend", "worker", "frontend"]

[tool.pytest.ini_options]
testpaths = ["backend", "scripts", "tests"]
markers = [
    "anyio: async tests (Session 09)",
]
