services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - C2_DATA_DIR=/app/data
      - C2_DB_FILE=/app/data/database/c2_database.db
      - SERVICE_API_KEY=dev-service-key
    depends_on:
      - redis
    volumes:
      - ../data:/app/data

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: python -m worker.main
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_BASE_URL=http://api:8000
      - SERVICE_API_KEY=dev-service-key
    depends_on:
      - api
      - redis

  streamlit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      - streamlit
      - run
      - frontend/streamlit/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api

  nicegui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: python -m frontend.nicegui.main --port 8081
    ports:
      - "8081:8081"
    environment:
      - API_BASE_URL=http://api:8000
      - C2_GUI_PORT=8081
    depends_on:
      - api
