<!DOCTYPE html>
<html>
<head>
    <title>Leaflet Fallback Test</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 600px; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([32.0853, 34.7818], 18);
        
        var SATELLITE_TILE_URL = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
        var transparent_pixel = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";
        
        L.tileLayer(SATELLITE_TILE_URL, {
            maxZoom: 19,
            maxNativeZoom: 13,
            attribution: 'Base'
        }).addTo(map);

        for (let z = 14; z <= 19; z++) {
            L.tileLayer(SATELLITE_TILE_URL + "?blankTile=false", {
                minZoom: z,
                maxZoom: 19,
                maxNativeZoom: z,
                errorTileUrl: transparent_pixel
            }).addTo(map);
        }
    </script>
</body>
</html>
